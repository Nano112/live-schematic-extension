<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <rect width="128" height="128" rx="24" fill="#1e1e1e"/>
  
  <!-- Three isometric cubes stacked in a centered pyramid.
       The top cube sits perfectly in the middle, resting on both bottom cubes.
       Drawn as wireframes with solid-looking isometric projection. -->
  <g transform="translate(64 79)" stroke="#cccccc" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round">
    
    <!-- Bottom-left cube -->
    <g>
      <polygon points="-17.321,-20 0,-10 0,10 -17.321,20 -34.641,10 -34.641,-10"/>
      <line x1="-17.321" y1="0" x2="-17.321" y2="20"/>
      <line x1="-17.321" y1="0" x2="0" y2="-10"/>
      <line x1="-17.321" y1="0" x2="-34.641" y2="-10"/>
    </g>

    <!-- Bottom-right cube -->
    <g>
      <polygon points="17.321,-20 34.641,-10 34.641,10 17.321,20 0,10 0,-10"/>
      <line x1="17.321" y1="0" x2="17.321" y2="20"/>
      <line x1="17.321" y1="0" x2="34.641" y2="-10"/>
      <line x1="17.321" y1="0" x2="0" y2="-10"/>
    </g>

    <!-- Top cube, perfectly centered on top of both bottom cubes -->
    <g>
      <polygon points="0,-50 17.321,-40 17.321,-20 0,-10 -17.321,-20 -17.321,-40"/>
      <line x1="0" y1="-30" x2="0" y2="-10"/>
      <line x1="0" y1="-30" x2="17.321" y2="-40"/>
      <line x1="0" y1="-30" x2="-17.321" y2="-40"/>
    </g>
    
  </g>
  
  <!-- "Live" indicator pip -->
  <circle cx="102" cy="26" r="13" fill="#ff5577" fill-opacity="0.22"/>
  <circle cx="102" cy="26" r="7" fill="#ff5577"/>
</svg>